# Fast checks on every push: the anti-fake audits, typecheck, unit tests, and the
# automated DESKTOP_DEV leg. The desktop leg cannot pass a phase (Rule 004) — it is here
# to catch regressions between real-device runs.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audits, typecheck, unit tests
        run: npm test
      - name: Install Chromium for the desktop leg
        run: npx playwright install --with-deps chromium
      - name: Desktop leg
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-desktop-evidence
          path: docs/phase0/evidence/phase0-desktop-chromium.*
