# Publishes the app to GitHub Pages.
#
# This is infrastructure for Rule 004, not a nicety: Phase 0 can only PASS on evidence from
# an iPhone, getUserMedia and DeviceMotion both require a secure context, and an iPhone
# reaching a laptop over LAN IP is not one. Pages gives a real HTTPS origin to test against.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions.

name: Deploy to GitHub Pages

# main only. The github-pages environment restricts deployments to the default branch by
# default, so triggering this from a feature branch produces a failed run that looks like a
# broken build but is just the protection rule doing its job. Use workflow_dispatch to
# redeploy on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        # Pages serves the site under /<repo>/, so the bundle needs a matching base.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - name: Disable Jekyll processing of the built output
        run: touch dist/.nojekyll
      - name: Verify the built entry references the deployed base path
        # A base-path mistake ships a page that loads nothing and shows a blank dark
        # rectangle, which is painful to diagnose from a phone. Catch it here instead.
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if ! grep -q "src=\"/$repo/assets/" dist/index.html; then
            echo "dist/index.html does not reference /$repo/assets/ — base path is wrong:"
            cat dist/index.html
            exit 1
          fi
          # Match the script tag specifically: the boot-failure notice mentions the dev
          # entry path in its prose, and a substring match would reject a correct build.
          if grep -q 'src="/src/main.ts"' dist/index.html; then
            echo "dist/index.html still loads the dev entry point"
            exit 1
          fi
          echo "base path OK"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
